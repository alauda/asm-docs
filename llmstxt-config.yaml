project_name: "Alauda Service Mesh"
summary: "Documentation for Alauda Service Mesh (ASM) — an Istio-based service mesh for Kubernetes covering installation, traffic management, security (mTLS, authorization), observability (metrics, tracing, topology), multi-cluster mesh, and microservice governance."
body: |
  This index points to the English Markdown/MDX documentation under `docs/en/`. Sections
  follow the in-repo information architecture: overview, install, quickstart, traffic
  management, security, distributed tracing, metrics monitoring, service topology,
  multi-cluster mesh, microservice governance, best practice, API reference, and FAQ.

include_patterns:
  - "docs/en/*.md"
  - "docs/en/*.mdx"
  - "docs/en/**/*.md"
  - "docs/en/**/*.mdx"

exclude_patterns:
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/.llmstxt-cache/**"
  - "**/llms.txt"
  - "**/llmstxt-state.json"
  - "**/CHANGELOG.md"
  - "**/CONTRIBUTING.md"
  - "**/.DS_Store"

grouping_base_path: "docs/en"

batch_size: 15

description_max_words: 150
